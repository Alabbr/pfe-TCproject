apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: pfe-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: pfe-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: rag-storage
              mountPath: /app/data
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/tc_hub_db"
            - name: ML_SERVICE_URL
              value: "http://ml-service:5000"
            - name: GROQ_API_KEY
              value: "YOUR_GROQ_API_KEY_HERE"
            - name: CLOUDINARY_API_KEY
              value: "YOUR_CLOUDINARY_API_KEY_HERE"
            - name: CLOUDINARY_API_SECRET
              value: "YOUR_CLOUDINARY_API_SECRET_HERE"
            - name: APP_PASSWORD
              value: "YOUR_EMAIL_APP_PASSWORD_HERE"
            - name: GEMINI_API_KEY
              value: "YOUR_GEMINI_API_KEY_HERE"
            - name: LLAMAPARSE_API_KEY
              value: "YOUR_LLAMAPARSE_API_KEY_HERE"
      volumes:
        - name: rag-storage
          persistentVolumeClaim:
            claimName: rag-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: pfe-app
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
