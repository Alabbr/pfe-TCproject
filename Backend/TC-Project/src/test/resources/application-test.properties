# =============================================
# DataSource — H2 In-Memory
# =============================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver

# =============================================
# Secondary DataSource — H2 In-Memory
# =============================================
spring.datasource.billing.url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.billing.jdbc-url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.billing.username=sa
spring.datasource.billing.password=password
spring.datasource.billing.driver-class-name=org.h2.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================
# Mocks for API Keys
# =============================================
CLOUDINARY_API_KEY=mock
CLOUDINARY_API_SECRET=mock
APP_PASSWORD=mock
GROQ_API_KEY=mock
GEMINI_API_KEY=mock
LLAMAPARSE_API_KEY=mock

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
