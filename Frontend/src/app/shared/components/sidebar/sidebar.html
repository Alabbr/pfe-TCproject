<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-container">
      <img src="logo-tco.png" alt="TC Logo" class="logo-image">
      <div class="logo-title">
        <span class="title-main">Tunisie Clearing</span>
        <span class="title-sub">Portail Administratif</span>
      </div>
    </div>
  </div>

  <div class="sidebar-content">
    <div class="nav-group" *ngFor="let group of navGroups">
      <!-- Accordion header for Documents group -->
      <div class="group-title" 
           *ngIf="!group.isAccordion">{{ group.name }}</div>
      
      <div class="group-title accordion-header" 
           *ngIf="group.isAccordion" 
           (click)="toggleDocsAccordion()">
        <span>{{ group.name }}</span>
        <span class="material-symbols-outlined accordion-arrow" 
              [class.expanded]="isDocsExpanded">expand_more</span>
      </div>

      <nav class="nav-items" [class.accordion-collapsed]="group.isAccordion && !isDocsExpanded">
        <ng-container *ngFor="let item of group.items">
          <!-- Always show the main "Espace Documents" link -->
          <a *ngIf="!item.isSubItem || (group.isAccordion && isDocsExpanded) || !group.isAccordion"
             [routerLink]="item.route" 
             routerLinkActive="active" 
             class="nav-link"
             [class.sub-item]="item.isSubItem">
            <span class="material-symbols-outlined nav-icon">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
            <span class="nav-badge" *ngIf="item.badge && item.badge > 0">{{ item.badge }}</span>
          </a>
        </ng-container>
      </nav>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="user-info" *ngIf="currentUser" (click)="openProfile()" style="cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='transparent'">
      <div class="avatar">
        <img *ngIf="currentUser.profilePictureUrl" [src]="currentUser.profilePictureUrl" alt="Avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
        <span *ngIf="!currentUser.profilePictureUrl" class="material-symbols-outlined">person</span>
      </div>
      <div class="user-details">
        <div class="user-name">{{ currentUser.fullName || 'Utilisateur' }}</div>
        <div class="user-role">{{ currentUser.role | roleFormat }}</div>
      </div>
    </div>
  </div>
</aside>
